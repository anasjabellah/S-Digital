spring:
  application:
    name: s-digital-platform

  datasource:
    # Override these with environment variables outside local development.
    # The fallbacks below are local dev credentials only (see docker-compose.yml).
    url: ${DB_URL:jdbc:postgresql://localhost:25432/sdigital}
    username: ${DB_USERNAME:sdigital}
    password: ${DB_PASSWORD:sdigital}

  jpa:
    # Flyway is the single source of truth for the schema.
    # Hibernate only validates that the mapping matches the migrated schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        # Cap the page size to protect the API from excessive requests.
        max-page-size: 100

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # The health probe is reachable anonymously (see SecurityConfig). Component
      # details would disclose infrastructure information (database product,
      # absolute filesystem paths, free disk space, TLS certificate chains), so
      # only the aggregate status is exposed. Details can still be enabled locally
      # when debugging, for example with
      # MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always.
      show-details: never

# --- Security -----------------------------------------------------------------
# The API is an OAuth2 resource server that validates Keycloak-issued JWTs.
#
# KEYCLOAK_ISSUER_URI: realm issuer of your Keycloak instance, for example
#   KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/s-digital
# When it is not set (default), the application still starts but rejects every
# bearer token (business endpoints answer 401). This keeps local development and
# the tests independent of a running Keycloak; override it to enable auth.
#
# KEYCLOAK_AUDIENCE: expected audience of the S-Digital API access tokens, i.e. the
#   value that must appear in the token's `aud` claim. Defaults to `s-digital-api`,
#   the API client declared in keycloak/import/s-digital-realm.json. A token with a
#   missing or different audience is rejected with 401. The imported realm defines
#   the matching Audience protocol mapper ("s-digital-api-audience") on the
#   `s-digital-api` client; an already-running realm must be re-imported or updated
#   before it emits that claim. A blank value fails closed.
#
# SDIGITAL_CORS_ALLOWED_ORIGINS: comma-separated list of allowed browser origins
#   (never "*"), for example:
#   SDIGITAL_CORS_ALLOWED_ORIGINS=http://localhost:5173,https://app.s-digital.io
# Empty by default: no cross-origin request is allowed.
#
# KEYCLOAK_CLIENT_ROLE_IDS: comma-separated client ids whose Keycloak client roles
#   (resource_access.<client-id>.roles) are trusted and mapped to authorities. Realm
#   roles (realm_access.roles) are always mapped. Roles of clients not listed here are
#   ignored, so a token cannot gain authorities from an unrelated client.
#   Example: KEYCLOAK_CLIENT_ROLE_IDS=s-digital-api,another-client
sdigital:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      audience: ${KEYCLOAK_AUDIENCE:s-digital-api}
      client-role-ids: ${KEYCLOAK_CLIENT_ROLE_IDS:s-digital-api}
    cors:
      allowed-origins: ${SDIGITAL_CORS_ALLOWED_ORIGINS:}
  # --- Keycloak Admin integration (user provisioning + realm-role management) --
  # Used by POST /api/v1/users/provision to create the Keycloak identity, and by the
  # ADMIN-only /api/v1/users/{id}/roles endpoints to consult and change a linked
  # user's realm roles. All values come from environment variables;
  # no secret is stored in Git.
  #
  # KEYCLOAK_ADMIN_SERVER_URL:  base URL of the Keycloak server,
  #   e.g. http://localhost:8180
  # KEYCLOAK_ADMIN_REALM:  realm that owns the users and the service-account client.
  # KEYCLOAK_ADMIN_CLIENT_ID:  confidential client id used by the backend.
  # KEYCLOAK_ADMIN_CLIENT_SECRET:  its secret (secret manager / env only).
  # SDIGITAL_KEYCLOAK_ROLE_ALLOWLIST:  comma-separated realm roles the API may assign
  #   or remove. Never include ADMIN. When empty, all role mutations fail closed
  #   (the read endpoint returns no manageable roles).
  keycloak:
    admin:
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:}
      realm: ${KEYCLOAK_ADMIN_REALM:}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      allowlist: ${SDIGITAL_KEYCLOAK_ROLE_ALLOWLIST:}
      connect-timeout: 3s
      read-timeout: 5s
